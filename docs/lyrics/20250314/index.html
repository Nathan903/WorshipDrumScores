
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>诗歌翻译</title>
        <link rel="stylesheet" href="code/styles.css">
    </head>
    <body>
        <!-- Menu Button for mobile -->
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</button>

        <!-- Navigation Bar -->
        <nav id="navbar">
            <ul> <li><a href="he-will-hold-me-fast.html" class="">他必保守我 He Will Hold Me Fast</a></li><li><a href="man-of-sorrows.html" class="">忧伤之子 Man of Sorrows</a></li><li><a href="christ-is-mine-forevermore.html" class="">基督属我到永远 Christ is Mine Forevermore</a></li> </ul>
        </nav>

        <!-- Content Section -->
        <div class="content">
            <button class="toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
            <h1>诗歌翻译</h1><div class="index-button"><a href="he-will-hold-me-fast.html" style="text-decoration: none;"><div class="index-heading">他必保守我 He Will Hold Me Fast</div><span class="deemphasize"></span></a></div><div class="index-button"><a href="man-of-sorrows.html" style="text-decoration: none;"><div class="index-heading">忧伤之子 Man of Sorrows</div><span class="deemphasize"></span></a></div><div class="index-button"><a href="christ-is-mine-forevermore.html" style="text-decoration: none;"><div class="index-heading">基督属我到永远 Christ is Mine Forevermore</div><span class="deemphasize"></span></a></div>
        </div>

        <script>
            let darkMode = localStorage.getItem('darkMode') === 'true';
            if (darkMode) {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggleBtn').textContent = '☀️';
            }
            function toggleTheme() {
                darkMode = !darkMode;
                document.body.setAttribute('data-theme', darkMode ? 'dark' : 'light');
                localStorage.setItem('darkMode', darkMode);
                document.getElementById('themeToggleBtn').textContent = darkMode ? '☀️' : '🌙';
            }
            
            // Mobile menu toggle
            function toggleMenu() {
                const nav = document.getElementById('navbar');
                nav.classList.toggle('open-nav');
            }
        </script>
    </body>
    </html>
